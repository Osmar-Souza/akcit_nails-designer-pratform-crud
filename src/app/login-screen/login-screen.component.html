<div class="min-h-screen bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-pink-600 mb-2">Nails Designer Pratform</h1>
      <p class="text-gray-600">Bem-vinda ao seu salão de beleza</p>
    </div>

    <div class="space-y-4">
      <button
        (click)="loginAsAdmin()"
        class="w-full bg-pink-600 hover:bg-pink-700 text-white py-4 rounded-xl font-semibold text-lg transition-all transform hover:scale-105 shadow-lg">
        Entrar como Administradora
      </button>

      <button
        (click)="loginAsClient()"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white py-4 rounded-xl font-semibold text-lg transition-all transform hover:scale-105 shadow-lg">
        Entrar como Cliente
      </button>
    </div>

    <div class="mt-8 text-center text-sm text-gray-500">
      <p>Escolha seu perfil de acesso</p>
    </div>
  </div>
</div>
