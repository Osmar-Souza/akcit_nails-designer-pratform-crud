<div class="space-y-6 animate-fade-in">
  <div class="bg-gradient-to-r from-pink-500 to-purple-600 rounded-2xl p-6 text-white shadow-lg">
    <h2 class="text-sm font-medium opacity-90 mb-1">Faturamento Total (Realizado)</h2>
    <div class="text-3xl font-bold">R$ {{ pastRevenue.toFixed(2) }}</div>
    <div class="mt-4 pt-4 border-t border-white/20 flex justify-between items-center">
      <div>
        <p class="text-xs opacity-80">Previsão Futura</p>
        <p class="text-lg font-semibold">R$ {{ futureRevenue.toFixed(2) }}</p>
      </div>
      <div class="bg-white/20 p-2 rounded-lg">
        <p class="text-xs font-bold">+{{ totalAppointments }} Agendas</p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <h3 class="text-gray-500 text-xs font-semibold uppercase mb-2">Balanço</h3>
      <div class="h-32">
        <!-- Placeholder for chart -->
        <div class="flex items-end justify-around h-full">
          <div *ngFor="let item of data" class="flex flex-col items-center">
            <div [style.height.%]="(item.value / Math.max(...data.map(d => d.value))) * 100" [style.background-color]="item.color" class="w-8 rounded-t"></div>
            <span class="text-xs mt-1">{{ item.name }}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <h3 class="text-gray-500 text-xs font-semibold uppercase mb-2">Status</h3>
      <div class="h-32">
        <!-- Placeholder for pie chart -->
        <div class="flex flex-wrap justify-center items-center h-full">
          <div *ngFor="let item of statusData" class="flex items-center mr-2 mb-2">
            <div [style.background-color]="item.fill" class="w-3 h-3 rounded-full mr-1"></div>
            <span class="text-xs">{{ item.name }}: {{ item.value }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
    <h3 class="text-gray-800 font-semibold mb-3">Resumo Rápido</h3>
    <div class="space-y-3">
      <div *ngFor="let item of data" class="flex justify-between items-center text-sm">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full" [style.background-color]="item.color"></div>
          <span class="text-gray-600">{{ item.name }}</span>
        </div>
        <span class="font-bold text-gray-900">R$ {{ item.value.toFixed(2) }}</span>
      </div>
    </div>
  </div>
</div>
