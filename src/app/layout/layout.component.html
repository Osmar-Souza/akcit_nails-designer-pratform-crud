<div class="min-h-screen bg-pink-50 flex flex-col max-w-md mx-auto shadow-2xl overflow-hidden relative border-x border-pink-100">
  <!-- Header -->
  <header class="bg-white p-6 shadow-sm z-10 sticky top-0">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-pink-600">Nails Designer Pratform</h1>
        <p class="text-xs text-gray-500">
          {{ isAdmin ? 'Modo Administrativo' : 'Área da Cliente' }}
        </p>
      </div>
      <div class="flex gap-2">
        <button
          (click)="onOpenNewBooking()"
          class="bg-pink-600 hover:bg-pink-700 text-white p-2 rounded-full shadow-lg transition-all"
          aria-label="Novo Agendamento">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
          </svg>
        </button>
        <button
          (click)="onLogout()"
          class="bg-gray-100 hover:bg-gray-200 text-gray-600 p-2 rounded-full transition-all"
          aria-label="Sair">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16,17 21,12 16,7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4 pb-24">
    <ng-content></ng-content>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bg-white border-t border-pink-100 fixed bottom-0 w-full max-w-md z-20 pb-safe">
    <div class="flex justify-around items-center h-16">
      <button
        *ngFor="let item of visibleNavItems"
        (click)="setActiveTab(item.id)"
        [class]="activeTab === item.id ? 'text-pink-600' : 'text-gray-400 hover:text-pink-400'"
        class="flex flex-col items-center justify-center w-full h-full transition-colors">
        <svg *ngIf="item.icon === 'dollar-sign'" width="24" height="24" [attr.stroke-width]="activeTab === item.id ? 2.5 : 2" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        <svg *ngIf="item.icon === 'calendar'" width="24" height="24" [attr.stroke-width]="activeTab === item.id ? 2.5 : 2" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <svg *ngIf="item.icon === 'sparkles'" width="24" height="24" [attr.stroke-width]="activeTab === item.id ? 2.5 : 2" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L13.063 8.5A2 2 0 0 0 14.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L14.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
          <path d="M20 3v4"></path>
          <path d="M22 5h-4"></path>
          <path d="M4 17v2"></path>
          <path d="M5 18H3"></path>
        </svg>
        <span class="text-[10px] mt-1 font-medium">{{ item.label }}</span>
      </button>
    </div>
  </nav>
</div>
